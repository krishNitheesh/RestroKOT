name: Build Windows .exe

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build RestroKOT_Portable.exe (single-file .exe)
        run: pyinstaller RestroKOT_Portable.spec --noconfirm --clean

      - name: Build RestroKOT folder (.exe)
        run: pyinstaller RestroKOT.spec --noconfirm --clean

      - name: Smoke-test RestroKOT_Portable.exe on Windows
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\RestroKOT_Portable.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try {
              $resp = Invoke-WebRequest -Uri "http://127.0.0.1:3000/login" -UseBasicParsing -TimeoutSec 2
              if ($resp.StatusCode -eq 200) {
                Write-Host "RestroKOT_Portable.exe responded HTTP 200 on /login!"
                $ok = $true
                break
              }
            } catch {}
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) {
            Write-Error "RestroKOT_Portable.exe failed to respond on port 3000!"
            exit 1
          }

      - name: Upload Windows .exe Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RestroKOT-Windows-EXE
          path: |
            dist/RestroKOT_Portable.exe
            dist/RestroKOT/
            Allow_WiFi_Devices.bat
