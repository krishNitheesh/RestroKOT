name: Build Windows .exe

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build RestroKOT_Portable.exe (single-file .exe)
        run: pyinstaller RestroKOT_Portable.spec --noconfirm --clean

      - name: Build RestroKOT folder (.exe)
        run: pyinstaller RestroKOT.spec --noconfirm --clean

      - name: Upload Windows .exe Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RestroKOT-Windows-EXE
          path: |
            dist/RestroKOT_Portable.exe
            dist/RestroKOT/
            Allow_WiFi_Devices.bat
