<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login | Grand Palace KOT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=3.0">
  <style>
    body {
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      margin: 0;
    }
    .login-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2.25rem 1.75rem;
      max-width: 460px;
      width: 100%;
      box-sizing: border-box;
      box-shadow: var(--shadow-xl);
    }
    .role-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      margin: 1.35rem 0;
    }
    @media (max-width: 480px) {
      body {
        padding: 0.75rem;
      }
      .login-card {
        padding: 1.5rem 1.15rem;
        border-radius: 16px;
      }
      .role-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.5rem;
      }
      .role-btn {
        padding: 0.75rem 0.5rem;
      }
    }
    .role-btn {
      background: #f8fafc;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem 0.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      transition: all 0.15s ease;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .role-btn:hover {
      border-color: var(--brand-primary);
      background: #eff6ff;
      color: var(--brand-primary);
    }
    .role-btn.active {
      border-color: var(--brand-primary);
      background: #dbeafe;
      color: #1d4ed8;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.15);
    }
    .role-btn svg {
      width: 24px;
      height: 24px;
    }
    .pin-input {
      width: 100%;
      font-size: 1.75rem;
      letter-spacing: 0.5em;
      text-align: center;
      padding: 0.75rem;
      border-radius: 12px;
      border: 2px solid var(--border-color);
      background: #f8fafc;
      font-family: var(--font-mono);
      font-weight: 800;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s;
    }
    .pin-input:focus {
      border-color: var(--brand-primary);
      background: #ffffff;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .key-btn {
      background: #ffffff;
      border: 1px solid var(--border-color);
      padding: 0.85rem;
      border-radius: 10px;
      font-size: 1.25rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.1s ease;
      color: var(--text-primary);
    }
    .key-btn:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }
    .key-btn:active {
      transform: scale(0.96);
    }
    .quick-pin-hint {
      margin-top: 1.5rem;
      padding: 0.85rem;
      border-radius: 10px;
      background: #f1f5f9;
      font-size: 0.8rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div style="text-align: center;">
      <div class="logo-badge" style="margin: 0 auto 0.75rem auto; width: 48px; height: 48px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2v20"/><path d="m14 2 2 4v16"/><path d="M2 15a4 4 0 0 0 8 0V2H2v13Z"/></svg>
      </div>
      <h2 style="font-size: 1.4rem; color: var(--text-primary); font-weight: 800;">Grand Palace KOT</h2>
      <p id="login-subtitle" style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.25rem;">Select station role &amp; enter PIN</p>
    </div>

    <!-- Owner Hidden Mode Banner (only shown when accessing /owner or ?role=owner) -->
    <div id="owner-mode-banner" class="hidden" style="margin: 1rem 0; padding: 0.65rem 1rem; border-radius: 12px; background: #eff6ff; border: 1.5px solid #bfdbfe; color: #1e40af; font-size: 0.85rem; font-weight: 800; text-align: center;">
      ★ Owner Executive Portal Login
    </div>

    <!-- Role Selection Tabs (Staff Only) -->
    <div class="role-grid" id="staff-role-grid">
      <div class="role-btn active" data-role="manager" onclick="selectRole('manager')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M8 7h8"/><path d="M8 11h8"/><path d="M8 15h5"/></svg>
        <span>Manager</span>
      </div>
      <div class="role-btn" data-role="captain" onclick="selectRole('captain')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Captain</span>
      </div>
      <div class="role-btn" data-role="kitchen" onclick="selectRole('kitchen')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3Z"/></svg>
        <span>Kitchen</span>
      </div>
      <div class="role-btn" data-role="service" onclick="selectRole('service')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span>Service</span>
      </div>
    </div>

    <!-- PIN Input Form -->
    <form onsubmit="handleLogin(event)">
      <!-- Captain Selection Strip (Visible when Captain role is chosen) -->
      <div id="captain-selector-container" class="hidden" style="margin-bottom: 0.85rem; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 0.75rem;">
        <div style="font-size: 0.75rem; font-weight: 800; color: #475569; margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.05em; display: flex; justify-content: space-between;">
          <span>Select Your Captain Profile:</span>
          <span style="color: #2563eb; font-weight: 700;" id="active-captain-label">Any</span>
        </div>
        <div id="captain-pills-list" style="display: flex; gap: 0.35rem; flex-wrap: wrap;">
          <!-- Dynamically populated -->
        </div>
      </div>

      <div style="margin-bottom: 0.75rem;">
        <input type="password" id="pin-input" class="pin-input" maxlength="6" placeholder="••••" required autofocus>
      </div>

      <!-- Quick Numeric Keypad -->
      <div class="keypad">
        <button type="button" class="key-btn" onclick="appendPin('1')">1</button>
        <button type="button" class="key-btn" onclick="appendPin('2')">2</button>
        <button type="button" class="key-btn" onclick="appendPin('3')">3</button>
        <button type="button" class="key-btn" onclick="appendPin('4')">4</button>
        <button type="button" class="key-btn" onclick="appendPin('5')">5</button>
        <button type="button" class="key-btn" onclick="appendPin('6')">6</button>
        <button type="button" class="key-btn" onclick="appendPin('7')">7</button>
        <button type="button" class="key-btn" onclick="appendPin('8')">8</button>
        <button type="button" class="key-btn" onclick="appendPin('9')">9</button>
        <button type="button" class="key-btn" style="color: #dc2626;" onclick="clearPin()">C</button>
        <button type="button" class="key-btn" onclick="appendPin('0')">0</button>
        <button type="button" class="key-btn" onclick="backspacePin()">⌫</button>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem; font-weight: 800;" id="login-submit-btn">
        Login &rarr;
      </button>
    </form>

    <!-- Public Screens Links -->
    <div style="margin-top: 1.25rem; text-align: center; border-top: 1px solid var(--border-color); padding-top: 1rem;">
      <a href="/display" target="_blank" style="color: var(--brand-primary); text-decoration: none; font-size: 0.85rem; font-weight: 600;">
        Open Customer TV Display (No Login Needed) &rarr;
      </a>
    </div>
  </div>

  <script src="/js/icons.js?v=3.0"></script>
  <script src="/js/ws.js?v=3.0"></script>
  <script>
    let currentRole = 'manager';
    let selectedCaptainId = null;
    let availableCaptains = [];
    const pinEl = document.getElementById('pin-input');

    // Support direct /login?role=owner (hidden from staff role grid)
    (function checkInitialRoleFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const r = (params.get('role') || '').toLowerCase();
      if (r === 'owner') {
        currentRole = 'owner';
        document.getElementById('staff-role-grid')?.classList.add('hidden');
        document.getElementById('owner-mode-banner')?.classList.remove('hidden');
        const sub = document.getElementById('login-subtitle');
        if (sub) sub.textContent = 'Enter Owner PIN to access live sales';
      } else if (['manager', 'captain', 'kitchen', 'service'].includes(r)) {
        setTimeout(() => selectRole(r), 0);
      }
    })();

    async function selectRole(role) {
      currentRole = role;
      document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`.role-btn[data-role="${role}"]`)?.classList.add('active');
      pinEl.value = '';
      pinEl.focus();

      const captainContainer = document.getElementById('captain-selector-container');
      if (role === 'captain') {
        if (captainContainer) captainContainer.classList.remove('hidden');
        await loadCaptainsForLogin();
      } else {
        if (captainContainer) captainContainer.classList.add('hidden');
        selectedCaptainId = null;
      }
    }

    async function loadCaptainsForLogin() {
      const listEl = document.getElementById('captain-pills-list');
      if (!listEl) return;

      try {
        const res = await fetch('/api/captains');
        const data = await res.json();
        if (data.success && Array.isArray(data.captains)) {
          availableCaptains = data.captains;
          if (availableCaptains.length > 1) {
            listEl.innerHTML = availableCaptains.map(c => `
              <button type="button" class="btn-captain-pill" data-id="${c.id}" onclick="selectSpecificCaptain(${c.id}, '${c.display_name.replace(/'/g, "\\'")}')"
                      style="background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 20px; padding: 4px 10px; font-size: 0.78rem; font-weight: 700; color: #334155; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;">
                <span>👨‍✈️</span>
                <span>${c.display_name}</span>
              </button>
            `).join('');
          } else if (availableCaptains.length === 1) {
            selectSpecificCaptain(availableCaptains[0].id, availableCaptains[0].display_name);
            listEl.innerHTML = `<span style="font-size: 0.8rem; font-weight: 700; color: #0284c7;">👨‍✈️ ${availableCaptains[0].display_name} (Enter PIN below)</span>`;
          }
        }
      } catch (e) {
        console.error('Failed to load captains:', e);
      }
    }

    function selectSpecificCaptain(id, name) {
      selectedCaptainId = id;
      const label = document.getElementById('active-captain-label');
      if (label) label.textContent = name;

      document.querySelectorAll('.btn-captain-pill').forEach(b => {
        if (Number(b.dataset.id) === Number(id)) {
          b.style.borderColor = '#2563eb';
          b.style.background = '#dbeafe';
          b.style.color = '#1e40af';
        } else {
          b.style.borderColor = '#cbd5e1';
          b.style.background = '#ffffff';
          b.style.color = '#334155';
        }
      });
      pinEl.focus();
    }

    function appendPin(num) {
      if (pinEl.value.length < 6) {
        pinEl.value += num;
        if (pinEl.value.length === 4) {
          // Auto submit after 4 digits
          setTimeout(() => handleLogin(new Event('submit')), 100);
        }
      }
    }

    function clearPin() {
      pinEl.value = '';
      pinEl.focus();
    }

    function backspacePin() {
      pinEl.value = pinEl.value.slice(0, -1);
      pinEl.focus();
    }

    async function handleLogin(e) {
      if (e) e.preventDefault();
      const pin = pinEl.value.trim();
      if (!pin) return;

      const submitBtn = document.getElementById('login-submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying...';

      const payload = { role: currentRole, pin: pin };
      if (currentRole === 'captain' && selectedCaptainId) {
        payload.user_id = selectedCaptainId;
      }

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
          sessionStorage.setItem('station_role', currentRole);
          sessionStorage.setItem('station_pin', pin);
          sessionStorage.setItem('station_user_name', data.display_name || '');
          showToast(`Welcome! Logged in as ${data.display_name || data.role}`, 'success');
          setTimeout(() => {
            window.location.href = data.redirect || `/${currentRole === 'manager' ? 'pos' : currentRole}`;
          }, 300);
        } else {
          showToast(data.error || 'Invalid PIN for this role', 'error');
          pinEl.value = '';
          pinEl.focus();
        }
      } catch (err) {
        showToast('Login network error', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Login →';
      }
    }
  </script>
</body>
</html>
